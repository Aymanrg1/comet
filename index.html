<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Comet | Creative House — Coming Soon</title>
  <meta name="description"
    content="Something extraordinary is on its way. Comet | Creative House is preparing to launch.">
  <meta name="theme-color" content="#05030f">
  <link rel="icon" href="./icons/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Inter:wght@300;400;500&family=Cairo:wght@400;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@7.2.0/css/all.min.css">
  <style>
    :root {
      --purple: #6D28D9;
      --cyan: #06B6D4;
      --yellow: #FFAE21;
      --pink: #EC489B;
      --bg: #05030f;
      --text: #F3F0FF;
      --muted: rgba(226, 220, 248, .72);
      --display: 'Orbitron', 'Cairo', system-ui, sans-serif;
      --body: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, 'Cairo', sans-serif;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    ::selection {
      background-color: #FFAE21;
      color: #000000;
    }

    html,
    body {
      height: 100%;
      overflow: hidden;
      background: var(--bg);
      color: var(--text);
      font-family: var(--body);
      -webkit-font-smoothing: antialiased
    }

    body {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      height: 100dvh
    }

    /* ---------- Background ---------- */
    .space {
      position: absolute;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      background:
        radial-gradient(60% 50% at 50% 42%, rgba(109, 40, 217, .28), transparent 70%),
        radial-gradient(40% 35% at 85% 90%, rgba(6, 182, 212, .14), transparent 70%),
        radial-gradient(35% 30% at 10% 10%, rgba(109, 40, 217, .16), transparent 70%),
        linear-gradient(180deg, #07041a 0%, #05030f 55%, #020108 100%);
    }

    /* static fallback stars (visible even without JS) */
    .space::before {
      content: "";
      position: absolute;
      inset: 0;
      opacity: .7;
      background-image:
        radial-gradient(1px 1px at 12% 22%, #fff, transparent),
        radial-gradient(1px 1px at 27% 68%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 41% 14%, #cfe9ff, transparent),
        radial-gradient(1px 1px at 58% 82%, #fff, transparent),
        radial-gradient(1px 1px at 73% 31%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 88% 58%, #ffe9c2, transparent),
        radial-gradient(1px 1px at 93% 12%, #fff, transparent),
        radial-gradient(1px 1px at 5% 88%, #fff, transparent);
    }

    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      opacity: var(--o, .6);
      animation: twinkle var(--d, 6s) ease-in-out infinite;
      animation-delay: var(--l, 0s)
    }

    .stars {
      position: absolute;
      inset: 0%;
      animation: drift 60s linear infinite alternate;
      will-change: transform;
    }

    @keyframes drift {
      from {
        transform: translate3d(-100%, -1%, 0);
      }

      to {
        transform: translate3d(100%, 1%, 0);
      }
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: var(--o, .6)
      }

      50% {
        opacity: calc(var(--o, .6)*.35)
      }
    }

    .orbits {
      position: absolute;
      left: 50%;
      top: 46%;
      width: min(150vmin, 1400px);
      aspect-ratio: 1;
      transform: translate(-50%, -50%);
      opacity: .55
    }

    .orbits svg {
      width: 100%;
      height: 100%;
      overflow: visible
    }

    .orbit {
      fill: none;
      stroke-width: 1;
      transform-origin: 50% 50%
    }

    .o1 {
      stroke: url(#gp);
      animation: spin 140s linear infinite
    }

    .o2 {
      stroke: url(#gc);
      animation: spin 200s linear infinite reverse
    }

    .o3 {
      stroke: rgba(255, 255, 255, .08)
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    .comet {
      position: absolute;
      top: -10%;
      left: -20%;
      width: 34vmax;
      height: 2px;
      transform: rotate(28deg);
      transform-origin: right center;
      background: linear-gradient(90deg, transparent, rgba(109, 40, 217, .0) 10%, rgba(6, 182, 212, .45) 70%, rgba(255, 174, 33, .95));
      border-radius: 2px;
      filter: blur(.3px);
      opacity: 0;
      animation: fly 22s ease-in-out infinite;
      animation-delay: 3s
    }

    .comet::after {
      content: "";
      position: absolute;
      right: -3px;
      top: 50%;
      width: 7px;
      height: 7px;
      margin-top: -3.5px;
      border-radius: 50%;
      background: var(--yellow);
      box-shadow: 0 0 10px 3px rgba(255, 174, 33, .7), 0 0 26px 8px rgba(255, 174, 33, .25)
    }

    @keyframes fly {
      0% {
        transform: translate3d(0, 0, 0) rotate(28deg);
        opacity: 0
      }

      6% {
        opacity: .9
      }

      32% {
        opacity: .9
      }

      42% {
        transform: translate3d(150vw, 80vh, 0) rotate(28deg);
        opacity: 0
      }

      100% {
        transform: translate3d(150vw, 80vh, 0) rotate(28deg);
        opacity: 0
      }
    }

    /* ---------- Layout ---------- */
    main {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: max(env(safe-area-inset-top), clamp(12px, 3vh, 32px)) 20px max(env(safe-area-inset-bottom), clamp(12px, 3vh, 32px));
      gap: clamp(10px, 2.6vh, 28px)
    }

    .stack {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: clamp(10px, 2.6vh, 26px);
      width: 100%;
      max-width: 880px
    }

    /* Logo */
    .logo {
      width: clamp(110px, 22vh, 190px);
      width: clamp(110px, min(22vh, 46vw), 190px);
      height: auto;
      display: block;
      filter: drop-shadow(0 0 22px rgba(109, 40, 217, .45));
      animation: rise 1.1s cubic-bezier(.2, .7, .2, 1) both
    }

    .logo-img {
      display: block;
      max-height: clamp(64px, 14vh, 120px);
      width: auto;
      max-width: 70vw
    }

    /* Headline */
    h1 {
      font-family: var(--display);
      font-weight: 900;
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: .14em;
      margin-right: -.14em;
      font-size: clamp(1.9rem, min(9.2vw, 12vh), 5.6rem);
      background: linear-gradient(100deg, #fff 0%, #e6dcff 38%, #b9a2ff 62%, var(--cyan) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 28px rgba(109, 40, 217, .5));
      animation: rise 1.1s .12s cubic-bezier(.2, .7, .2, 1) both
    }

    .rule {
      width: clamp(56px, 12vw, 120px);
      height: 2px;
      border-radius: 2px;
      background: linear-gradient(90deg, transparent, var(--yellow), transparent);
      opacity: .85;
      animation: fade 1.4s .35s both
    }

    .lead {
      font-size: clamp(.98rem, min(2.2vw, 3.2vh), 1.35rem);
      font-weight: 300;
      letter-spacing: .02em;
      color: var(--text);
      animation: rise 1.1s .26s cubic-bezier(.2, .7, .2, 1) both;
      margin-top: 20px;
      font-family: "orbitron";
    }

    .lead a {
      text-decoration: none;
      padding: 12px 32px;
      background: rgba(255, 255, 255, .05);
      color: white;
      border: 1px solid rgba(255, 255, 255, .14);
      border-radius: 8px;
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease, color .35s ease, background .35s ease;
      font-size: 16px;
    }

    .lead a:hover {
      transform: translateY(-3px);
      color: #fff;
      border-color: var(--cyan);
      background: rgba(6, 182, 212, .12);
      box-shadow: 0 0 22px rgba(6, 182, 212, .4)
    }

    .hero-img {
      width: 164px;
    }

    .slogan {
      font-family: var(--display);
      font-weight: 500;
      font-size: clamp(.62rem, min(1.9vw, 2.4vh), .86rem);
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--muted);
      animation: rise 1.1s .38s cubic-bezier(.2, .7, .2, 1) both
    }

    .slogan span {
      color: var(--yellow)
    }

    /* Social */
    .social {
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: clamp(8px, 2vw, 14px);
      animation: rise 1.1s .5s cubic-bezier(.2, .7, .2, 1) both
    }

    .social:empty {
      display: none
    }

    .social a {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      color: var(--text);
      text-decoration: none;
      background: rgba(255, 255, 255, .05);
      border: 1px solid rgba(255, 255, 255, .14);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      transition: transform .35s ease, box-shadow .35s ease, border-color .35s ease, color .35s ease, background .35s ease
    }

    .social svg {
      width: 20px;
      height: 20px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round
    }

    .social a:hover {
      transform: translateY(-3px);
      color: #fff;
      border-color: var(--cyan);
      background: rgba(6, 182, 212, .12);
      box-shadow: 0 0 22px rgba(6, 182, 212, .4)
    }

    .social a:focus-visible {
      outline: 2px solid var(--yellow);
      outline-offset: 3px;
      transform: translateY(-3px)
    }

    .copy {
      position: absolute;
      left: 0;
      right: 0;
      bottom: max(env(safe-area-inset-bottom), 10px);
      z-index: 1;
      text-align: center;
      font-size: .7rem;
      letter-spacing: .08em;
      color: rgba(226, 220, 248, .5);
      padding: 0 16px
    }

    @keyframes rise {
      from {
        opacity: 0;
        transform: translate3d(0, 14px, 0)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    @keyframes fade {
      from {
        opacity: 0
      }

      to {
        opacity: .85
      }
    }

    /* ---------- Responsive ---------- */
    @media (max-width:768px) {
      .orbits {
        opacity: .4;
        top: 42%
      }

      .o3,
      .comet {
        display: none
      }

      .stack {
        gap: clamp(10px, 2.4vh, 22px)
      }

      h1 {
        letter-spacing: .1em;
        margin-right: -.1em
      }

      .slogan {
        letter-spacing: .16em
      }
    }

    @media (max-width:380px) {
      h1 {
        font-size: clamp(1.6rem, 9.5vw, 2.2rem)
      }

      .slogan {
        font-size: .58rem;
        letter-spacing: .12em
      }

      .social a {
        width: 44px;
        height: 44px
      }
    }

    @media (max-height:620px) {
      .rule {
        display: none
      }

      .copy {
        display: none
      }
    }

    @media (max-height:460px) {
      .logo {
        width: clamp(70px, 20vh, 110px)
      }

      .lead {
        font-size: .88rem
      }

      .lead a {
        font-size: 12px;
      }

      .slogan {
        font-size: .56rem
      }

      .social a {
        width: 40px;
        height: 40px
      }

      .social svg {
        width: 17px;
        height: 17px
      }
    }

    @media (max-height:340px) and (orientation:landscape) {
      .slogan {
        display: none
      }
    }

    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important
      }

      .comet {
        display: none
      }
    }
  </style>
</head>

<body>

    <div class="stars" id="stars"></div>
    <div class="orbits">
      <svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet">

          </linearGradient>
        </defs>
        <ellipse class="orbit o1" cx="500" cy="500" rx="470" ry="190" transform="rotate(-24 500 500)" />
        <ellipse class="orbit o2" cx="500" cy="500" rx="380" ry="120" transform="rotate(32 500 500)" />
        <circle class="orbit o3" cx="500" cy="500" r="330" />

  <main>

      <!-- </svg> -->

      <h1>Coming Soon</h1>
      <div class="rule" aria-hidden="true"></div>

      <p class="slogan">You imagine is <span>the only limit.</span></p>

      <!-- Rendered from the SOCIALS list in the script below. Stays hidden until real URLs are added. -->

        <p class="lead"><a href="mailto:Comethub.cs@gmail.com">Contact us</a></p>
      </div>
    </div>
  </main>

  <p class="copy">&copy; <span id="year">2026</span> Comet | Creative House. All rights reserved.</p>

  <script>
    (function () {
      'use strict';
      /* ================================================================
         SOCIAL LINKS — add real profile URLs here. Nothing is shown until
         a URL is provided. Supported keys: instagram, facebook, linkedin,

         ================================================================ */
      var SOCIALS = {
        instagram: 'https://www.instagram.com/comethub.arg',

        linkedin: '',

        tiktok: 'https://www.tiktok.com/@comethub.arg',
        whatsapp: 'https://wa.me/message/QLRXGSN33KO3A1'
      };

      var ICONS = {
        instagram: '<rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/>',
        facebook: '<path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/>',
        linkedin: '<path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect width="4" height="12" x="2" y="9"/><circle cx="4" cy="4" r="2"/>',

        dribbble: '<circle cx="12" cy="12" r="10"/><path d="M19.13 5.09C15.22 9.14 10 10.44 2.25 10.94"/><path d="M21.75 12.84c-6.62-1.41-12.14 1-16.38 6.32"/><path d="M8.56 2.75c4.37 6 6 9.42 8 17.72"/>',
        tiktok: '<path d="M9 12a4 4 0 1 0 4 4V4a5 5 0 0 0 5 5"/>',
        whatsapp: '<i class="fa-brands fa-whatsapp"></i>',

        // email: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
      };

      var list = document.getElementById('social');
      Object.keys(SOCIALS).forEach(function (key) {
        var url = (SOCIALS[key] || '').trim();
        if (!/^https:\/\//i.test(url) || !ICONS[key]) return;
        var li = document.createElement('li');
        var a = document.createElement('a');
        a.href = url; a.target = '_blank'; a.rel = 'noopener noreferrer';
        a.setAttribute('aria-label', LABELS[key]);
        a.title = LABELS[key];
        if (key === 'whatsapp') {
          a.innerHTML = ICONS[key];
          a.querySelector('i').setAttribute('aria-hidden', 'true');
        } else {
          a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICONS[key] + '</svg>';
        }
        // a.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + ICONS[key] + '</svg>';
        li.appendChild(a); list.appendChild(li);
      });

      document.getElementById('year').textContent = new Date().getFullYear();

      /* Starfield: light, CSS-animated, fewer stars on small screens */
      var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
      var small = window.innerWidth < 768;
      var count = small ? 45 : 95;
      var box = document.getElementById('stars');
      var frag = document.createDocumentFragment();
      var tints = ['#ffffff', '#ffffff', '#ffffff', '#cfe9ff', '#e3d8ff', '#ffe9c2'];
      for (var i = 0; i < count; i++) {
        var s = document.createElement('span');
        s.className = 'star';
        var size = Math.random() < .12 ? 2.2 : (Math.random() < .5 ? 1.5 : 1);
        s.style.cssText = 'left:' + (Math.random() * 100).toFixed(2) + '%;top:' + (Math.random() * 100).toFixed(2) + '%;width:' + size + 'px;height:' + size + 'px;background:' + tints[(Math.random() * tints.length) | 0] + ';--o:' + (.25 + Math.random() * .6).toFixed(2) + ';--d:' + (4 + Math.random() * 6).toFixed(1) + 's;--l:-' + (Math.random() * 8).toFixed(1) + 's';
        if (reduce) s.style.animation = 'none';
        frag.appendChild(s);
      }
      box.appendChild(frag);
    })();
  </script>
